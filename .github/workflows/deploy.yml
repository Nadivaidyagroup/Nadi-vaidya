# ============================================================
# NADI VAIDYA - AUTOMATIC DEPLOYMENT
# Website: https://nadivaidya.in
# Hosting: cPanel
#
# REQUIRED GITHUB REPOSITORY SECRETS:
# FTP_SERVER
# FTP_USERNAME
# FTP_PASSWORD
#
# OPTIONAL GITHUB REPOSITORY SECRET:
# DB_PASSWORD
#
# FTP_SERVER: ftp.joinus.co.in
# FTP_USERNAME: nadivaidya@nadivaidya.in
# FTP PORT: 21
# FTP PROTOCOL: Explicit FTPS
#
# If DB_PASSWORD is configured:
#   - PHP API is included in deployment.
#   - db.secret.php is generated during deployment.
#
# If DB_PASSWORD is missing:
#   - PHP API deployment is skipped.
#   - Existing remote API files are excluded from the
#     frontend-only FTP deployment.
#
# Deployment logs are saved in deploy-logs branch.
# ============================================================

name: Deploy website

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nadivaidya-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy Website
    runs-on: ubuntu-24.04

    steps:

      # --------------------------------------------------------
      # 1. CHECKOUT REPOSITORY
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. SETUP NODE.JS
      # --------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --------------------------------------------------------
      # 3. INITIALIZE DEPLOYMENT LOG
      # --------------------------------------------------------

      - name: Initialize deployment log
        run: |
          mkdir -p /tmp/deploylog

          {
            echo "======================================"
            echo "NADI VAIDYA DEPLOYMENT"
            echo "======================================"
            echo "Run ID: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Date: $(date -u)"
            echo "======================================"
          } | tee /tmp/deploylog/log.txt

      # --------------------------------------------------------
      # 4. VALIDATE GITHUB SECRETS
      # --------------------------------------------------------

      - name: Validate GitHub secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

        run: |
          set -euo pipefail

          check_secret() {
            local name="$1"
            local value="$2"

            if [ -z "$value" ]; then
              echo "ERROR: $name is missing" | tee -a /tmp/deploylog/log.txt
              return 1
            fi

            echo "OK: $name is configured" | tee -a /tmp/deploylog/log.txt
          }

          check_secret "FTP_SERVER" "$FTP_SERVER"
          check_secret "FTP_USERNAME" "$FTP_USERNAME"
          check_secret "FTP_PASSWORD" "$FTP_PASSWORD"

          if [ -n "$DB_PASSWORD" ]; then
            echo "OK: DB_PASSWORD is configured" | tee -a /tmp/deploylog/log.txt
          else
            echo "INFO: DB_PASSWORD missing; API deployment will be skipped" | tee -a /tmp/deploylog/log.txt
          fi

      # --------------------------------------------------------
      # 5. INSTALL DEPENDENCIES
      # --------------------------------------------------------

      - name: Install dependencies
        run: |
          set -euo pipefail

          npm ci --no-audit --no-fund 2>&1 | tee -a /tmp/deploylog/log.txt

      # --------------------------------------------------------
      # 6. BUILD PRODUCTION WEBSITE
      # --------------------------------------------------------

      - name: Build production website
        run: |
          set -euo pipefail

          npm run build 2>&1 | tee -a /tmp/deploylog/log.txt

          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory not found" | tee -a /tmp/deploylog/log.txt
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html not found" | tee -a /tmp/deploylog/log.txt
            exit 1
          fi

          echo "SUCCESS: Production build completed" | tee -a /tmp/deploylog/log.txt

      # --------------------------------------------------------
      # 7. PREPARE PHP API
      # --------------------------------------------------------

      - name: Prepare PHP API
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

        run: |
          set -euo pipefail

          if [ -n "$DB_PASSWORD" ]; then

            if [ ! -d "api" ]; then
              echo "ERROR: API directory not found" | tee -a /tmp/deploylog/log.txt
              exit 1
            fi

            mkdir -p dist/api/config

            cp -a api/. dist/api/

            mkdir -p dist/api/config

            rm -f dist/api/admin/error_log

            php <<'PHP'
          <?php

          $password = getenv("DB_PASSWORD");

          if ($password === false || $password === "") {
              fwrite(STDERR, "ERROR: DB_PASSWORD is empty\n");
              exit(1);
          }

          $content = "<?php\nreturn [\n    'password' => "
              . var_export($password, true)
              . ",\n];\n";

          $result = file_put_contents(
              "dist/api/config/db.secret.php",
              $content,
              LOCK_EX
          );

          if ($result === false) {
              fwrite(STDERR, "ERROR: Could not create db.secret.php\n");
              exit(1);
          }

          PHP

            chmod 600 dist/api/config/db.secret.php

            echo "SUCCESS: PHP API prepared" | tee -a /tmp/deploylog/log.txt

          else

            echo "INFO: DB_PASSWORD missing; API deployment skipped" | tee -a /tmp/deploylog/log.txt

          fi

      # --------------------------------------------------------
      # 8. FTP DNS AND PORT DIAGNOSTICS
      # --------------------------------------------------------

      - name: Diagnose FTP DNS and connectivity
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}

        run: |
          set -euo pipefail

          echo "Checking FTP configuration..." | tee -a /tmp/deploylog/log.txt

          if [ "$FTP_SERVER" != "ftp.joinus.co.in" ]; then
            echo "ERROR: FTP_SERVER does not match expected hostname." | tee -a /tmp/deploylog/log.txt
            echo "Please update the FTP_SERVER GitHub secret." | tee -a /tmp/deploylog/log.txt
            exit 1
          fi

          echo "FTP_SERVER value format is correct." | tee -a /tmp/deploylog/log.txt

          echo "Checking DNS using configured hostname..." | tee -a /tmp/deploylog/log.txt

          if ! getent ahosts "$FTP_SERVER"; then
            echo "ERROR: GitHub cannot resolve FTP hostname." | tee -a /tmp/deploylog/log.txt
            exit 1
          fi

          echo "SUCCESS: FTP hostname resolved." | tee -a /tmp/deploylog/log.txt

          echo "Checking DNS using Google DNS..." | tee -a /tmp/deploylog/log.txt

          if command -v nslookup >/dev/null 2>&1; then
            nslookup ftp.joinus.co.in 8.8.8.8 2>&1 | tee -a /tmp/deploylog/log.txt
          else
            echo "nslookup is unavailable; skipping Google DNS check." | tee -a /tmp/deploylog/log.txt
          fi

          echo "Checking FTP port 21..." | tee -a /tmp/deploylog/log.txt

          if ! nc -vz -w 15 "$FTP_SERVER" 21 2>&1 | tee -a /tmp/deploylog/log.txt; then
            echo "ERROR: FTP port 21 is unreachable." | tee -a /tmp/deploylog/log.txt
            exit 1
          fi

          echo "SUCCESS: FTP port 21 is reachable." | tee -a /tmp/deploylog/log.txt

      # --------------------------------------------------------
      # 9. VERIFY DEPLOYMENT DIRECTORY
      # --------------------------------------------------------

      - name: Verify deployment directory
        run: |
          set -euo pipefail

          echo "Local directory: ./dist/" | tee -a /tmp/deploylog/log.txt
          echo "Remote directory: ./" | tee -a /tmp/deploylog/log.txt

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html not found" | tee -a /tmp/deploylog/log.txt
            exit 1
          fi

          echo "SUCCESS: Deployment directory verified" | tee -a /tmp/deploylog/log.txt

      # --------------------------------------------------------
      # 10A. DEPLOY WEBSITE AND API
      # Runs when DB_PASSWORD is configured.
      # --------------------------------------------------------

      - name: Upload website and PHP API to cPanel
        id: ftp_full
        if: ${{ secrets.DB_PASSWORD != '' }}

        uses: SamKirkland/FTP-Deploy-Action@v4.3.5

        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          protocol: ftps
          port: 21
          security: strict

          local-dir: ./dist/
          server-dir: ./

          log-level: verbose

          exclude: |
            **/.git*
            **/.git*/**
            **/error_log

      # --------------------------------------------------------
      # 10B. DEPLOY FRONTEND ONLY
      # Runs when DB_PASSWORD is missing.
      # API paths are excluded from this deployment.
      # --------------------------------------------------------

      - name: Upload frontend only to cPanel
        id: ftp_frontend
        if: ${{ secrets.DB_PASSWORD == '' }}

        uses: SamKirkland/FTP-Deploy-Action@v4.3.5

        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          protocol: ftps
          port: 21
          security: strict

          local-dir: ./dist/
          server-dir: ./

          log-level: verbose

          exclude: |
            **/.git*
            **/.git*/**
            api/**
            api/**/*
            **/api/**
            **/api/**/*
            **/error_log

      # --------------------------------------------------------
      # 11. SAVE DEPLOYMENT LOGS
      # --------------------------------------------------------

      - name: Save deployment log
        if: always()

        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          set +e

          mkdir -p /tmp/deploylog

          if [ ! -f /tmp/deploylog/log.txt ]; then
            touch /tmp/deploylog/log.txt
          fi

          echo "======================================" >> /tmp/deploylog/log.txt
          echo "Job status: ${{ job.status }}" >> /tmp/deploylog/log.txt
          echo "Full FTP status: ${{ steps.ftp_full.outcome }}" >> /tmp/deploylog/log.txt
          echo "Frontend FTP status: ${{ steps.ftp_frontend.outcome }}" >> /tmp/deploylog/log.txt
          echo "Run ID: $GITHUB_RUN_ID" >> /tmp/deploylog/log.txt
          echo "Commit: $GITHUB_SHA" >> /tmp/deploylog/log.txt
          echo "Date: $(date -u)" >> /tmp/deploylog/log.txt
          echo "======================================" >> /tmp/deploylog/log.txt

          tail -c 60000 /tmp/deploylog/log.txt > /tmp/deploylog/last.txt

          cd /tmp/deploylog

          git init -q
          git checkout -q -b deploy-logs

          git config user.name "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"

          cp last.txt "run-$GITHUB_RUN_ID.txt"
          cp last.txt latest.txt

          git add latest.txt "run-$GITHUB_RUN_ID.txt"

          git commit -qm "Deployment log $GITHUB_RUN_ID"

          git -c http.extraheader="AUTHORIZATION: bearer $GH_TOKEN" \
            push -q --force \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            deploy-logs || echo "WARNING: Could not save deployment logs"

          echo "Deployment log processing completed."

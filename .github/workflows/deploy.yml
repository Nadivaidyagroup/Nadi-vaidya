# हर बार main branch में बदलाव आते ही वेबसाइट अपने-आप build होकर
# cPanel hosting (nadivaidya.in) पर चढ़ जाती है।
#
# GitHub → Settings → Secrets and variables → Actions में ये secrets चाहिए:
#   FTP_SERVER    — जैसे ftp.nadivaidya.in
#   FTP_USERNAME  — cPanel में बनाया FTP account (folder: nadivaidya.in)
#   FTP_PASSWORD  — उसी FTP account का password
#   DB_PASSWORD   — MySQL user "nadivaidyanewwebsite" का नया password
# DB_PASSWORD न हो तो api फ़ोल्डर नहीं बदला जाता (server वाला चलता रहता है)।

name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Add PHP api (only when DB password secret exists)
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -n "$DB_PASSWORD" ]; then
            cp -r api dist/api
            rm -f dist/api/admin/error_log
            php -r 'file_put_contents("dist/api/config/db.secret.php", "<?php\nreturn [\"password\" => " . var_export(getenv("DB_PASSWORD"), true) . "];\n");'
            echo "api folder will be deployed"
          else
            echo "DB_PASSWORD secret missing — skipping api folder"
          fi

      - name: Upload to hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            uploads/**

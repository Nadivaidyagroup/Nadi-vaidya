# हर बार main branch में बदलाव आते ही वेबसाइट अपने-आप build होकर
# cPanel hosting (nadivaidya.in) पर चढ़ जाती है।
#
# GitHub → Settings → Secrets and variables → Actions में ये secrets चाहिए:
#   FTP_SERVER    — जैसे ftp.nadivaidya.in
#   FTP_USERNAME  — cPanel में बनाया FTP account (folder: nadivaidya.in)
#   FTP_PASSWORD  — उसी FTP account का password
#   DB_PASSWORD   — MySQL user "nadivaidyanewwebsite" का नया password
# DB_PASSWORD न हो तो api फ़ोल्डर नहीं बदला जाता (server वाला चलता रहता है)।
# हर run का छोटा log "deploy-logs" branch में सेव होता है (बिना passwords के)।

name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check secrets (names only)
        run: |
          mkdir -p /tmp/deploylog
          {
            echo "run: $GITHUB_RUN_ID  commit: $GITHUB_SHA"
            for n in FTP_SERVER FTP_USERNAME FTP_PASSWORD DB_PASSWORD; do
              v="${!n}"; if [ -n "$v" ]; then echo "$n: set"; else echo "$n: MISSING"; fi
            done
          } | tee /tmp/deploylog/log.txt
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      - name: Install
        run: npm ci --no-audit --no-fund 2>&1 | tee -a /tmp/deploylog/log.txt; exit ${PIPESTATUS[0]}

      - name: Build
        run: npm run build 2>&1 | tee -a /tmp/deploylog/log.txt; exit ${PIPESTATUS[0]}

      - name: Add PHP api (only when DB password secret exists)
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -n "$DB_PASSWORD" ]; then
            cp -r api dist/api
            rm -f dist/api/admin/error_log
            php -r 'file_put_contents("dist/api/config/db.secret.php", "<?php\nreturn [\"password\" => " . var_export(getenv("DB_PASSWORD"), true) . "];\n");'
            echo "api folder will be deployed" | tee -a /tmp/deploylog/log.txt
          else
            echo "DB_PASSWORD secret missing — skipping api folder" | tee -a /tmp/deploylog/log.txt
          fi

      - name: Upload to hosting
        id: ftp
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
          log-level: minimal
          exclude: |
            **/.git*
            **/.git*/**
            uploads/**

      - name: Save log to deploy-logs branch
        if: always()
        run: |
          echo "job status: ${{ job.status }}  ftp step: ${{ steps.ftp.outcome }}" >> /tmp/deploylog/log.txt
          tail -c 60000 /tmp/deploylog/log.txt > /tmp/deploylog/last.txt
          cd /tmp/deploylog && git init -q && git checkout -q -b deploy-logs
          git config user.name "deploy-bot"; git config user.email "deploy-bot@users.noreply.github.com"
          cp last.txt "run-$GITHUB_RUN_ID.txt"; cp last.txt latest.txt
          git add latest.txt "run-$GITHUB_RUN_ID.txt"; git commit -qm "deploy log $GITHUB_RUN_ID"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" deploy-logs || true
